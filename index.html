<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌声委員会タイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2130;
    --ink-2:#242c3f;
    --gold:#c8993f;
    --gold-soft:#8f733c;
    --cream:#f4ecd8;
    --cream-dim:#b9b2a0;
    --slate:#435a5f;
    --coral:#cf5b3f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    transition:background 0.4s ease;
  }
  body.finished{
    background:#2a1a15;
    color:var(--cream);
  }
  .stage{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .eyebrow{
    font-family:'Fraunces', serif;
    font-size:15px;
    letter-spacing:0.14em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .staff{
    width:100%;
    max-width:520px;
    height:56px;
    position:relative;
    margin-bottom:8px;
  }
  .staff-line{
    position:absolute;
    left:0;
    width:100%;
    height:1px;
    background:rgba(244,236,216,0.16);
  }
  .staff-fill{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0%;
    overflow:hidden;
    transition:width 1s linear;
  }
  .staff-fill .staff-line{
    background:var(--gold);
    opacity:0.55;
  }
  .note{
    position:absolute;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--gold);
    top:50%;
    transform:translate(-50%,-50%) rotate(-18deg) scaleX(1.15);
    box-shadow:2px 0 0 -1px var(--gold);
    transition:left 1s linear;
  }
  .note::after{
    content:'';
    position:absolute;
    right:-1px;
    top:-19px;
    width:1.6px;
    height:20px;
    background:var(--gold);
  }
  .display{
    font-family:'Space Grotesk', monospace;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:clamp(64px, 18vw, 148px);
    line-height:1;
    letter-spacing:0.01em;
    margin:18px 0 6px;
    font-feature-settings:"tnum";
  }
  body.finished .display{ color:var(--coral); }
  .status{
    font-size:14px;
    color:var(--cream-dim);
    letter-spacing:0.04em;
    height:20px;
    margin-bottom:28px;
  }
  .presets{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
  }
  .chip{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    color:var(--cream);
    background:transparent;
    border:1px solid rgba(244,236,216,0.28);
    border-radius:999px;
    padding:8px 18px;
    cursor:pointer;
    transition:border-color 0.2s, background 0.2s;
  }
  .chip:hover{ border-color:var(--gold); }
  .chip.active{
    border-color:var(--gold);
    background:rgba(200,153,63,0.14);
    color:var(--gold);
  }
  .custom{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:30px;
    color:var(--cream-dim);
    font-size:14px;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper button{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid rgba(244,236,216,0.28);
    background:transparent;
    color:var(--cream);
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }
  .stepper button:hover{ border-color:var(--gold); color:var(--gold); }
  .stepper span{
    min-width:48px;
    text-align:center;
    font-family:'Space Grotesk', monospace;
    font-size:16px;
    color:var(--cream);
  }
  .controls{
    display:flex;
    gap:14px;
    margin-bottom:28px;
  }
  .btn{
    font-family:'Work Sans', sans-serif;
    font-weight:500;
    font-size:15px;
    padding:13px 30px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform 0.12s, opacity 0.2s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:var(--gold);
    color:#241a08;
  }
  .btn-secondary{
    background:transparent;
    color:var(--cream);
    border-color:rgba(244,236,216,0.28);
  }
  .btn-secondary:hover{ border-color:var(--gold); color:var(--gold); }
  .btn:disabled{ opacity:0.35; cursor:default; }
  .pendulum-wrap{
    width:64px;
    height:44px;
    margin-bottom:4px;
    position:relative;
    display:flex;
    justify-content:center;
  }
  .pendulum{
    position:absolute;
    bottom:0;
    width:2px;
    height:38px;
    background:var(--gold-soft);
    transform-origin:bottom center;
    transform:rotate(0deg);
    opacity:0;
  }
  .pendulum::after{
    content:'';
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--gold-soft);
  }
  .pendulum.swinging{
    opacity:0.9;
    animation:swing var(--beat, 1s) ease-in-out infinite;
  }
  @keyframes swing{
    0%{ transform:rotate(-22deg); }
    50%{ transform:rotate(22deg); }
    100%{ transform:rotate(-22deg); }
  }
  .fullscreen-btn{
    position:absolute;
    top:18px;
    right:18px;
    background:transparent;
    border:none;
    color:var(--cream-dim);
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.04em;
  }
  .fullscreen-btn:hover{ color:var(--gold); }
  @media (max-width:480px){
    .custom{ font-size:13px; }
    .btn{ padding:12px 22px; font-size:14px; }
  }
</style>
</head>
<body>
<button class="fullscreen-btn" onclick="toggleFullscreen()">全画面 ⤢</button>

<div class="stage" id="stage">
  <div class="eyebrow">歌声委員会 タイマー</div>

  <div class="staff" id="staff">
    <div class="staff-line" style="top:8px;"></div>
    <div class="staff-line" style="top:20px;"></div>
    <div class="staff-line" style="top:32px;"></div>
    <div class="staff-line" style="top:44px;"></div>
    <div class="staff-fill" id="staffFill">
      <div class="staff-line" style="top:8px;"></div>
      <div class="staff-line" style="top:20px;"></div>
      <div class="staff-line" style="top:32px;"></div>
      <div class="staff-line" style="top:44px;"></div>
    </div>
    <div class="note" id="staffNote" style="left:0%;"></div>
  </div>

  <div class="display" id="display">05:00</div>
  <div class="status" id="status"></div>

  <div class="pendulum-wrap"><div class="pendulum" id="pendulum"></div></div>

  <div class="presets" id="presets">
    <button class="chip" data-sec="60">1分</button>
    <button class="chip active" data-sec="180">3分</button>
    <button class="chip" data-sec="300">5分</button>
    <button class="chip" data-sec="600">10分</button>
  </div>

  <div class="custom">
    <span>カスタム設定</span>
    <div class="stepper">
      <button onclick="adjustCustom(-1)">−</button>
      <span id="customMin">3</span>
      <span style="color:var(--cream-dim);">分</span>
      <button onclick="adjustCustom(1)">+</button>
    </div>
    <div class="stepper">
      <button onclick="adjustCustomSec(-5)">−</button>
      <span id="customSec">0</span>
      <span style="color:var(--cream-dim);">秒</span>
      <button onclick="adjustCustomSec(5)">+</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="clearBtn" onclick="clearTimer()">クリア</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetTimer()">リセット</button>
    <button class="btn btn-primary" id="startBtn" onclick="toggleStart()">開始</button>
  </div>
</div>

<script>
let totalSeconds = 180;
let remaining = 180;
let running = false;
let intervalId = null;
let audioCtx = null;

const display = document.getElementById('display');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const pendulum = document.getElementById('pendulum');
const staffFill = document.getElementById('staffFill');
const staffNote = document.getElementById('staffNote');
const customMinEl = document.getElementById('customMin');
const customSecEl = document.getElementById('customSec');
let customMinutes = 3;
let customSecondsPart = 0;

function formatTime(sec){
  if(sec > 0 && sec < 10){
    return '00:' + sec.toFixed(1).padStart(4,'0');
  }
  const whole = Math.ceil(sec - 0.001);
  const m = Math.floor(whole / 60);
  const s = whole % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateDisplay(){
  display.textContent = formatTime(remaining);
  const progress = totalSeconds > 0 ? (1 - remaining / totalSeconds) : 0;
  staffFill.style.width = (progress * 100) + '%';
  staffNote.style.left = (progress * 100) + '%';
}

function setPreset(sec, chipEl){
  if(running) return;
  totalSeconds = sec;
  remaining = sec;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  if(chipEl) chipEl.classList.add('active');
  updateDisplay();
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => setPreset(parseInt(chip.dataset.sec), chip));
});

function adjustCustom(delta){
  if(running) return;
  customMinutes = Math.max(0, Math.min(60, customMinutes + delta));
  if(customMinutes === 0 && customSecondsPart === 0) customSecondsPart = 5;
  customMinEl.textContent = customMinutes;
  applyCustom();
}

function adjustCustomSec(delta){
  if(running) return;
  customSecondsPart += delta;
  if(customSecondsPart >= 60){
    customSecondsPart -= 60;
    customMinutes = Math.min(60, customMinutes + 1);
    customMinEl.textContent = customMinutes;
  } else if(customSecondsPart < 0){
    if(customMinutes > 0){
      customSecondsPart += 60;
      customMinutes -= 1;
      customMinEl.textContent = customMinutes;
    } else {
      customSecondsPart = 0;
    }
  }
  customSecEl.textContent = customSecondsPart;
  applyCustom();
}

function applyCustom(){
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  totalSeconds = customMinutes * 60 + customSecondsPart;
  remaining = totalSeconds;
  updateDisplay();
}

function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const notes = [
      {t:0.00, dur:0.11, gain:0.28},
      {t:0.16, dur:0.11, gain:0.28},
      {t:0.32, dur:0.16, gain:0.18},
      {t:0.68, dur:0.11, gain:0.28},
      {t:0.84, dur:0.11, gain:0.28},
      {t:1.00, dur:0.16, gain:0.18}
    ];
    notes.forEach(n => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1568;
      gain.gain.setValueAtTime(0.0001, now + n.t);
      gain.gain.exponentialRampToValueAtTime(n.gain, now + n.t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.dur + 0.02);
    });
  }catch(e){}
}

function tick(){
  remaining = Math.round((remaining - 0.1) * 10) / 10;
  updateDisplay();
  if(remaining <= 0){
    remaining = 0;
    finish();
  }
}

function finish(){
  clearInterval(intervalId);
  running = false;
  document.body.classList.add('finished');
  pendulum.classList.remove('swinging');
  startBtn.textContent = '開始';
  status.textContent = '時間になりました';
  beep();
}

function toggleStart(){
  if(document.body.classList.contains('finished')){
    resetTimer();
    return;
  }
  if(running){
    clearInterval(intervalId);
    running = false;
    startBtn.textContent = '再開';
    pendulum.classList.remove('swinging');
    status.textContent = '一時停止中';
  } else {
    if(remaining <= 0) return;
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    running = true;
    startBtn.textContent = '一時停止';
    pendulum.classList.add('swinging');
    pendulum.style.setProperty('--beat', '1.2s');
    status.textContent = '';
    intervalId = setInterval(tick, 100);
  }
}

function clearTimer(){
  clearInterval(intervalId);
  running = false;
  document.body.classList.remove('finished');
  totalSeconds = 0;
  remaining = 0;
  customMinutes = 0;
  customSecondsPart = 0;
  customMinEl.textContent = customMinutes;
  customSecEl.textContent = customSecondsPart;
  startBtn.textContent = '開始';
  pendulum.classList.remove('swinging');
  status.textContent = '';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  updateDisplay();
}

function resetTimer(){
  clearInterval(intervalId);
  running = false;
  document.body.classList.remove('finished');
  remaining = totalSeconds;
  startBtn.textContent = '開始';
  pendulum.classList.remove('swinging');
  status.textContent = '';
  updateDisplay();
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}

updateDisplay();
</script>
</body>
</html>
